    // 右クリック・ドラッグ防止
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
    document.addEventListener('dragstart', (e) => { if (e.target.tagName === 'IMG') { e.preventDefault(); } });

    // モバイルメニュー制御
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const iconMenu = document.getElementById('iconMenu');
    const iconClose = document.getElementById('iconClose');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function toggleMenu() {
        mobileMenu.classList.toggle('hidden');
        iconMenu.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    }
    menuBtn.addEventListener('click', toggleMenu);
    mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (!mobileMenu.classList.contains('hidden')) { toggleMenu(); }
        });
    });

    // TOPへ戻るボタン制御
    window.addEventListener('scroll', () => {
        const btn = document.getElementById('scrollTopBtn');
        if (window.scrollY > 300) { 
            btn.classList.remove('opacity-0', 'invisible');
            btn.classList.add('opacity-100', 'visible');
        } else {
            btn.classList.remove('opacity-100', 'invisible');
            btn.classList.add('opacity-0', 'invisible');
        }
    });

    // DOM読み込み完了時にニュース一覧を動的生成・描画
    document.addEventListener('DOMContentLoaded', () => {
        const newsContainer = document.getElementById('news-list');
        
        // HTMLタグの組み立てと挿入
        newsContainer.innerHTML = newsData.map(item => {
            const titleText = item.title || `【新規登録】「${item.name}」が新たに参加しました!`;
            const newBadge = item.label === "NEW" ? `<span class="text-[9px] tracking-widest text-[#d7be53] border border-[#d7be53]/60 bg-[#d7be53]/10 px-2 py-0.5 rounded font-medium uppercase">NEW</span>` : '';
            
            return `
                <a href="${item.link}" class="news-item block py-6 flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-6 group transition-colors hover:bg-white/[0.02] px-4 -mx-4 rounded">
                    <time datetime="${item.date}" class="font-serif text-xs text-[#DDCB82]/60 tracking-widest w-24">${item.displayDate}</time>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        ${newBadge}
                        <span class="text-[9px] tracking-widest bg-white/5 text-gray-300 px-2.5 py-0.5 rounded border border-white/5 uppercase text-center min-w-[50px]">${item.category}</span>
                    </div>
                    <h2 class="text-sm text-gray-300 group-hover:text-[#d7be53] transition-colors tracking-wide flex-1 leading-relaxed">
                        ${titleText}
                    </h2>
                    <span class="hidden sm:block text-gray-600 group-hover:text-[#d7be53] transition-colors text-xs">→</span>
                </a>
            `;
        }).join('');

        // ニュースもっと見る・閉じる制御（初期10件、以降5件ずつ表示）
        const INITIAL_COUNT = 10;
        const STEP_COUNT = 5;

        const items = document.querySelectorAll('#news-list .news-item');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const loadMoreContainer = document.getElementById('load-more-container');

        if (items.length <= INITIAL_COUNT) {
            return;
        }

        function resetNewsList() {
            items.forEach((item, index) => {
                if (index >= INITIAL_COUNT) {
                    item.classList.add('is-hidden');
                }
            });
            loadMoreBtn.textContent = 'MORE NEWS +';
            loadMoreContainer.classList.remove('hidden');
        }

        resetNewsList();

        loadMoreBtn.addEventListener('click', () => {
            const hiddenItems = document.querySelectorAll('#news-list .news-item.is-hidden');
            
            if (hiddenItems.length === 0) {
                resetNewsList();
                const newsListHeader = document.getElementById('news-list');
                if (newsListHeader) {
                    newsListHeader.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                return;
            }

            for (let i = 0; i < STEP_COUNT && i < hiddenItems.length; i++) {
                hiddenItems[i].classList.remove('is-hidden');
            }

            if (document.querySelectorAll('#news-list .news-item.is-hidden').length === 0) {
                loadMoreBtn.textContent = 'CLOSE -';
            }
        });
    });
</script>
