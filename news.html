<!-- models_data.js だけを読み込む -->
    <script src="./assets/js/models_data.js"></script>

    <!-- SCRIPTS -->
    <script>
    // 右クリック・ドラッグ防止
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
    document.addEventListener('dragstart', (e) => { if (e.target.tagName === 'IMG') { e.preventDefault(); } });

    // モバイルメニュー制御
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const iconMenu = document.getElementById('iconMenu');
    const iconClose = document.getElementById('iconClose');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function toggleMenu() {
        mobileMenu.classList.toggle('hidden');
        iconMenu.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    }
    menuBtn.addEventListener('click', toggleMenu);
    mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (!mobileMenu.classList.contains('hidden')) { toggleMenu(); }
        });
    });

    // TOPへ戻るボタン制御
    window.addEventListener('scroll', () => {
        const btn = document.getElementById('scrollTopBtn');
        if (window.scrollY > 300) { 
            btn.classList.remove('opacity-0', 'invisible');
            btn.classList.add('opacity-100', 'visible');
        } else {
            btn.classList.remove('opacity-100', 'visible');
            btn.classList.add('opacity-0', 'invisible');
        }
    });

    // DOM読み込み完了時にニュース一覧を動的生成・描画
    document.addEventListener('DOMContentLoaded', () => {
        renderNewsList('news-list');

        // ニュースもっと見る・閉じる制御（初期10件、以降5件ずつ表示）
        const INITIAL_COUNT = 10;
        const STEP_COUNT = 5;

        const items = document.querySelectorAll('#news-list .news-item');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const loadMoreContainer = document.getElementById('load-more-container');

        if (items.length <= INITIAL_COUNT) {
            return;
        }

        function resetNewsList() {
            items.forEach((item, index) => {
                if (index >= INITIAL_COUNT) {
                    item.classList.add('is-hidden');
                }
            });
            loadMoreBtn.textContent = 'MORE NEWS +';
            loadMoreContainer.classList.remove('hidden');
        }

        resetNewsList();

        loadMoreBtn.addEventListener('click', () => {
            const hiddenItems = document.querySelectorAll('#news-list .news-item.is-hidden');
            
            if (hiddenItems.length === 0) {
                resetNewsList();
                const newsListHeader = document.getElementById('news-list');
                if (newsListHeader) {
                    newsListHeader.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                return;
            }

            for (let i = 0; i < STEP_COUNT && i < hiddenItems.length; i++) {
                hiddenItems[i].classList.remove('is-hidden');
            }

            if (document.querySelectorAll('#news-list .news-item.is-hidden').length === 0) {
                loadMoreBtn.textContent = 'CLOSE -';
            }
        });
    });
    </script>
</body>
</html>
