<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & OGP -->
    <title>CONTACT | FAIRY MODELS AGENCY</title>
    <meta name="description" content="FAIRY MODELS AGENCYへのお問い合わせ・キャスティングのご相談はこちら。モデルの起用、撮影・コレクションのご依頼、モデル応募（Scout / Application）に関するお問い合わせを受け付けております。">
    <meta property="og:title" content="CONTACT | FAIRY MODELS AGENCY">
    <meta property="og:description" content="FAIRY MODELS AGENCYへのお問い合わせ・キャスティングのご相談はこちら。モデルの起用、撮影・コレクションのご依頼、モデル応募に関するお問い合わせを受け付けております。">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="FAIRY MODELS AGENCYへのお問い合わせ・キャスティングのご相談はこちら。モデルの起用、撮影・コレクションのご依頼、モデル応募に関するお問い合わせを受け付けております。">

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#1C110C',      /* エスプレッソのような極深ブラウン */
                            medium: '#2A1A14',    /* ビターチョコレートブラウン */
                            light: '#3D261C',     /* ココアブラウン */
                            gold: '#C89B3C',      /* 鈍く光るアンティークゴールド */
                            lightgold: '#DDCB82'  /* 柔らかなシャンパンゴールド */
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-[#1C110C] text-[#EAE6E1] font-sans antialiased selection:bg-[#C89B3C] selection:text-white overflow-x-hidden min-h-screen flex flex-col justify-between">

    <header class="fixed w-full top-0 z-50 bg-[#1C110C]/90 backdrop-blur-md border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center py-4 md:h-28 gap-2 relative">
                <div class="hidden md:block w-32"></div>
                
                <div class="text-center cursor-pointer">
                    <a href="./index.html" class="font-serif text-2xl md:text-3xl tracking-[0.25em] font-bold text-[#C89B3C] uppercase">
                        FAIRY MODEL <span class="font-light text-[#DDCB82]">AGENCY</span>
                    </a>
                </div>

                <nav class="hidden md:flex space-x-10 text-xs tracking-[0.2em] font-medium text-gray-400">
                    <a href="./index.html#about" class="hover:text-[#C89B3C] transition-colors">ABOUT</a>
                    <a href="./index.html#models" class="hover:text-[#C89B3C] transition-colors">MODELS</a>
                    <a href="./index.html#news" class="hover:text-[#C89B3C] transition-colors">NEWS</a>
                    <a href="./index.html#contact" class="hover:text-[#C89B3C] transition-colors">CONTACT</a>
            </nav>
           </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-40 pb-24 w-full flex-grow">
        
        <div class="text-center mb-16">
            <h1 class="font-serif text-3xl tracking-[0.2em] text-[#C89B3C] uppercase">CONTACT</h1>
            <p class="text-[10px] tracking-widest text-gray-500 mt-3 uppercase">お問い合わせ / 出演・取材依頼</p>
            <div class="w-8 h-[1px] bg-[#C89B3C]/30 mx-auto mt-6"></div>
        </div>

        <form class="space-y-8 font-light text-sm bg-[#2A1A14] border border-white/5 p-8 sm:p-12 rounded shadow-2xl">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Company Name <span class="text-gray-600">/ 会社名</span></label>
                    <input type="text" placeholder="Shop Kloset Inc." class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] placeholder-gray-700 focus:outline-none focus:border-[#C89B3C] transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Your Name <span class="text-[#C89B3C]">*</span> <span class="text-gray-600">/ お名前</span></label>
                    <input type="text" required placeholder="Tarō Yamada" class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] placeholder-gray-700 focus:outline-none focus:border-[#C89B3C] transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Email Address <span class="text-[#C89B3C]">*</span> <span class="text-gray-600">/ メールアドレス</span></label>
                    <input type="email" required placeholder="example@domain.com" class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] placeholder-gray-700 focus:outline-none focus:border-[#C89B3C] transition-colors">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Phone Number <span class="text-gray-600">/ 電話番号</span></label>
                    <input type="tel" placeholder="03-0000-0000" class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] placeholder-gray-700 focus:outline-none focus:border-[#C89B3C] transition-colors">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Inquiry Type <span class="text-[#C89B3C]">*</span> <span class="text-gray-600">/ お問い合わせ項目</span></label>
                <div class="relative">
                    <select required class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] appearance-none focus:outline-none focus:border-[#C89B3C] transition-colors cursor-pointer">
                        <option value="" disabled selected class="text-gray-700">選択してください / Select an option</option>
                        <option value="casting">モデルキャスティングのご依頼 (Casting)</option>
                        <option value="press">取材・プレス関連のお問い合わせ (Press)</option>
                        <option value="become">モデル応募・オーディション (Become a Model)</option>
                        <option value="other">その他のお問い合わせ (Other)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#DDCB82]/50">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs tracking-widest text-[#DDCB82]/70 uppercase">Message <span class="text-[#C89B3C]">*</span> <span class="text-gray-600">/ お問い合わせ内容</span></label>
                <textarea required rows="6" placeholder="ご依頼内容、スケジュール、ご予算などをご記入ください。" class="w-full bg-[#1C110C] border border-white/10 rounded px-4 py-3 text-[#EAE6E1] placeholder-gray-700 focus:outline-none focus:border-[#C89B3C] transition-colors resize-none"></textarea>
            </div>

            <div class="flex items-start gap-3 pt-2">
                <input type="checkbox" required id="agree" class="mt-1 accent-[#C89B3C] cursor-pointer">
                <label for="agree" class="text-xs text-gray-400 leading-normal cursor-pointer select-none">
                    当エージェンシーの <a href="./privacy.html" target="_blank" class="text-[#C89B3C] underline hover:text-[#DDCB82] transition-colors">プライバシーポリシー</a> に同意の上、送信してください。
                </label>
            </div>

            <div class="text-center pt-4">
                <button type="submit" class="w-full bg-[#C89B3C] text-[#1C110C] py-4 text-xs tracking-[0.2em] font-bold uppercase hover:bg-[#DDCB82] transition-colors rounded shadow-lg">
                    SEND MESSAGE
                </button>
            </div>

        </form>

        <div class="text-center mt-12">
            <a href="./index.html" class="text-xs tracking-widest text-gray-500 hover:text-[#C89B3C] transition-colors inline-flex items-center gap-2 font-medium">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                BACK TO TOP
            </a>
        </div>

    </main>

    <footer class="bg-[#110A07] py-12 text-center border-t border-white/5 space-y-4">
        <div class="flex flex-wrap justify-center gap-x-8 gap-y-2 text-xs tracking-[0.15em]">
            <a href="./company.html" class="text-[#DDCB82]/60 hover:text-[#C89B3C] transition-colors">COMPANY / LEGAL</a>
            <a href="./privacy.html" class="text-[#DDCB82]/60 hover:text-[#C89B3C] transition-colors">PRIVACY POLICY</a>
            <a href="./terms.html" class="text-[#DDCB82]/60 hover:text-[#C89B3C] transition-colors">TERMS OF USE</a>
            <a href="./cookie.html" class="text-[#DDCB82]/60 hover:text-[#C89B3C] transition-colors">COOKIE POLICY</a>
        </div>
        <p class="text-[#DDCB82]/20 text-[11px] tracking-widest">&copy; 2026 Shop Kloset Inc. / FAIRY MODELS AGENCY. All Rights Reserved.</p>
    </footer>

    <button id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
            class="fixed bottom-8 right-8 z-50 w-11 h-11 bg-[#110A07]/80 backdrop-blur-md border border-[#C89B3C]/30 text-[#DDCB82] rounded-full flex items-center justify-center opacity-0 invisible transition-all duration-300 hover:border-[#C89B3C] hover:text-[#C89B3C] group shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 transform group-hover:-translate-y-0.5 transition-transform">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
        </svg>
    </button>

    <script>
        // ボタンをスクロール量に合わせて「フワッ」と出すための制御スクリプト
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('scrollTopBtn');
            if (window.scrollY > 300) {
                btn.classList.remove('opacity-0', 'invisible');
                btn.classList.add('opacity-100', 'visible');
            } else {
                btn.classList.remove('opacity-100', 'visible');
                btn.classList.add('opacity-0', 'invisible');
            }
        });
    </script>
</body>
</html>
